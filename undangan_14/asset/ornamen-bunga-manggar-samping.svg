<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 540" fill="none">
  <defs>
    <linearGradient id="mggGold" x1="0" y1="0" x2="180" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9E2"/>
      <stop offset="35%" stop-color="#F7DB7C"/>
      <stop offset="72%" stop-color="#DCAA2E"/>
      <stop offset="100%" stop-color="#8F610C"/>
    </linearGradient>
    <linearGradient id="mggJade" x1="90" y1="20" x2="90" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#177358"/>
      <stop offset="55%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#041913"/>
    </linearGradient>
  </defs>

  <!-- 1. PAYUNG UBUR-UBUR DIRAJA BERTINGKAT TIGA (3-Tiered Royal Malay Parasol) -->
  <line x1="90" y1="6" x2="90" y2="490" stroke="url(#mggGold)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="90" cy="10" r="5" fill="#FFF9E2"/>

  <!-- Tier 1 (Top Small Parasol) -->
  <path d="M52 44 Q90 16 128 44 Z" fill="url(#mggGold)" stroke="#052119" stroke-width="1.5"/>
  <path d="M54 44 Q66 52 78 44 Q90 52 102 44 Q114 52 126 44" stroke="url(#mggGold)" stroke-width="2" fill="none"/>

  <!-- Tier 2 (Middle Emerald & Gold Parasol) -->
  <path d="M36 78 Q90 42 144 78 Z" fill="url(#mggJade)" stroke="url(#mggGold)" stroke-width="2"/>
  <path d="M38 78 Q51 87 64 78 Q77 87 90 78 Q103 87 116 78 Q129 87 142 78" stroke="url(#mggGold)" stroke-width="2.2" fill="none"/>

  <!-- Tier 3 (Main Wide Royal Yellow Parasol with Dangling Pearls) -->
  <path d="M18 118 Q90 72 162 118 Z" fill="url(#mggGold)" stroke="#052119" stroke-width="1.8"/>
  <path d="M20 118 Q34 130 48 118 Q62 130 76 118 Q90 130 104 118 Q118 130 132 118 Q146 130 160 118"
        stroke="url(#mggGold)" stroke-width="2.5" fill="none"/>
  <g fill="#FFF9E2">
    <circle cx="27" cy="129" r="3"/>
    <circle cx="55" cy="129" r="3"/>
    <circle cx="90" cy="131" r="3.5"/>
    <circle cx="125" cy="129" r="3"/>
    <circle cx="153" cy="129" r="3"/>
  </g>

  <!-- 2. POHON BUNGA MANGGAR MEKAR (Lush Exploding Fountain of 14 Palm-Tinsel Sprays) -->
  <g stroke="url(#mggGold)" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- Upper Fountain Arcs -->
    <path d="M90 290 C68 232 38 188 12 196"/>
    <path d="M90 290 C112 232 142 188 168 196"/>
    <path d="M90 295 C56 248 22 218 8 236"/>
    <path d="M90 295 C124 248 158 218 172 236"/>
    <path d="M90 302 C50 272 18 258 10 280"/>
    <path d="M90 302 C130 272 162 258 170 280"/>
    <!-- Lower Fountain Arcs -->
    <path d="M90 310 C54 298 24 296 16 322"/>
    <path d="M90 310 C126 298 156 296 164 322"/>
    <path d="M90 318 C62 320 36 330 28 358"/>
    <path d="M90 318 C118 320 144 330 152 358"/>
    <!-- Inner High Sprays -->
    <path d="M90 285 C74 220 56 170 42 166"/>
    <path d="M90 285 C106 220 124 170 138 166"/>
  </g>

  <!-- Shimmering Bunga Manggar Blossom Pom-Poms Along the Strands -->
  <g fill="url(#mggGold)">
    <circle cx="42" cy="166" r="6"/>
    <circle cx="138" cy="166" r="6"/>
    <circle cx="12" cy="196" r="6.5"/>
    <circle cx="168" cy="196" r="6.5"/>
    <circle cx="8" cy="236" r="6.5"/>
    <circle cx="172" cy="236" r="6.5"/>
    <circle cx="10" cy="280" r="6"/>
    <circle cx="170" cy="280" r="6"/>
    <circle cx="16" cy="322" r="5.5"/>
    <circle cx="164" cy="322" r="5.5"/>
    <circle cx="28" cy="358" r="5"/>
    <circle cx="152" cy="358" r="5"/>
  </g>
  <g fill="#FFF9E2">
    <circle cx="42" cy="166" r="2.8"/>
    <circle cx="138" cy="166" r="2.8"/>
    <circle cx="12" cy="196" r="3"/>
    <circle cx="168" cy="196" r="3"/>
    <circle cx="8" cy="236" r="3"/>
    <circle cx="172" cy="236" r="3"/>
    <circle cx="52" cy="224" r="3.5"/>
    <circle cx="128" cy="224" r="3.5"/>
    <circle cx="46" cy="264" r="3.5"/>
    <circle cx="134" cy="264" r="3.5"/>
  </g>

  <!-- 3. PAHAR / GUCI DIRAJA BERKAKI (Ornate Royal Malay Pedestal Vase Holding the Bunga Manggar) -->
  <!-- Pineapple/Nanas Base Bulb -->
  <ellipse cx="90" cy="312" rx="22" ry="28" fill="url(#mggGold)" stroke="#052119" stroke-width="1.8"/>
  <path d="M72 304 L108 320 M108 304 L72 320" stroke="#052119" stroke-width="1.4"/>

  <!-- Fluted Chalice Bowl (Jambangan Pahar) -->
  <path d="M48 336 H132 L116 392 C112 406 102 414 90 414 C78 414 68 406 64 392 Z"
        fill="url(#mggJade)" stroke="url(#mggGold)" stroke-width="2.5"/>
  <path d="M44 336 H136" stroke="url(#mggGold)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="368" r="10" fill="url(#mggGold)"/>
  <circle cx="90" cy="368" r="4" fill="#052119"/>

  <!-- Tall Sculpted Pedestal Stem & Base -->
  <path d="M78 414 H102 L108 456 H72 Z" fill="url(#mggGold)" stroke="#052119" stroke-width="1.6"/>
  <path d="M54 456 H126 L136 474 H44 Z" fill="url(#mggJade)" stroke="url(#mggGold)" stroke-width="2.2"/>

  <!-- Hanging Kelingkan Silk Tassels Beneath the Pedestal -->
  <g stroke="url(#mggGold)" stroke-width="2.2" stroke-linecap="round">
    <line x1="66" y1="476" x2="66" y2="512"/>
    <line x1="78" y1="476" x2="78" y2="522"/>
    <line x1="90" y1="476" x2="90" y2="532"/>
    <line x1="102" y1="476" x2="102" y2="522"/>
    <line x1="114" y1="476" x2="114" y2="512"/>
  </g>
</svg>
