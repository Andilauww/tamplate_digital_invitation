<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 400" fill="none">
  <defs>
    <linearGradient id="tedungRed" x1="25" y1="40" x2="185" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C24124"/>
      <stop offset="50%" stop-color="#962A15"/>
      <stop offset="100%" stop-color="#5E1609"/>
    </linearGradient>
    <linearGradient id="tedungGold" x1="20" y1="10" x2="190" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="45%" stop-color="#F0BC42"/>
      <stop offset="100%" stop-color="#9A6812"/>
    </linearGradient>
    <filter id="tedungDrop" x="-15%" y="-8%" width="130%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#110A06" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#tedungDrop)">
    <!-- Carved Gilded Pole (Tangkai Tedung) with Saput Poleng Wrap -->
    <rect x="101" y="160" width="8" height="228" rx="4" fill="url(#tedungGold)"/>
    <!-- Saput Poleng Sacred Checkered Ribbon Wrap on Pole -->
    <g transform="translate(99 246)">
      <rect x="0" y="0" width="12" height="36" rx="2" fill="#181412" stroke="url(#tedungGold)" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="6" fill="#FAF3E3"/>
      <rect x="6" y="6" width="6" height="6" fill="#FAF3E3"/>
      <rect x="0" y="12" width="6" height="6" fill="#FAF3E3"/>
      <rect x="6" y="18" width="6" height="6" fill="#FAF3E3"/>
      <rect x="0" y="24" width="6" height="6" fill="#FAF3E3"/>
      <rect x="6" y="30" width="6" height="6" fill="#FAF3E3"/>
      <!-- Red Tridatu Sash Tie -->
      <rect x="-2" y="15" width="16" height="5" rx="2" fill="#B8381E" stroke="url(#tedungGold)" stroke-width="0.9"/>
    </g>
    <!-- Pedestal Base -->
    <path d="M78 392 C82 380 92 376 105 376 C118 376 128 380 132 392 Z" fill="url(#tedungGold)"/>

    <!-- Top Spire Finial (Murda Kencana) -->
    <path d="M105 8 L112 28 L108 36 L114 48 H96 L102 36 L98 28 Z" fill="url(#tedungGold)"/>
    <circle cx="105" cy="8" r="4" fill="#FFF4C8"/>

    <!-- TIER 1 (Top Small Canopy) -->
    <path d="M105 44 C82 52 64 64 56 76 H154 C146 64 128 52 105 44 Z"
          fill="url(#tedungRed)" stroke="url(#tedungGold)" stroke-width="2"/>
    <path d="M56 76 C64 84 72 84 80 76 C88 84 96 84 105 76 C114 84 122 84 130 76 C138 84 146 84 154 76"
          fill="url(#tedungGold)"/>

    <!-- TIER 2 (Middle Medium Canopy) -->
    <path d="M105 82 C72 92 44 108 34 124 H176 C166 108 138 92 105 82 Z"
          fill="url(#tedungRed)" stroke="url(#tedungGold)" stroke-width="2.2"/>
    <!-- Prada Ribs -->
    <path d="M105 84 L68 124 M105 84 L105 124 M105 84 L142 124" stroke="url(#tedungGold)" stroke-width="1.2" opacity="0.8"/>
    <path d="M34 124 C45 134 56 134 69 124 C81 134 93 134 105 124 C117 134 129 134 141 124 C154 134 165 134 176 124"
          fill="url(#tedungGold)"/>

    <!-- TIER 3 (Main Grand Lower Canopy) -->
    <path d="M105 130 C62 142 28 162 16 184 H194 C182 162 148 142 105 130 Z"
          fill="url(#tedungRed)" stroke="url(#tedungGold)" stroke-width="2.4"/>
    <!-- Prada Gold Radial Ribs -->
    <path d="M105 132 L46 184 M105 132 L76 184 M105 132 L105 184 M105 132 L134 184 M105 132 L164 184"
          stroke="url(#tedungGold)" stroke-width="1.3" opacity="0.85"/>
    <!-- Scalloped Prada Valance (Rumbai Tedung) -->
    <path d="M16 184
             Q30 198 45 184 Q60 198 75 184 Q90 198 105 184
             Q120 198 135 184 Q150 198 165 184 Q180 198 194 184
             V192
             Q180 206 165 192 Q150 206 135 192 Q120 206 105 192
             Q90 206 75 192 Q60 206 45 192 Q30 206 16 192 Z"
          fill="url(#tedungGold)"/>

    <!-- Dangling Golden Bell Tassels & White Beads Along Rim -->
    <g stroke="url(#tedungGold)" stroke-width="1.3">
      <line x1="22" y1="192" x2="22" y2="216"/>
      <line x1="52" y1="196" x2="52" y2="218"/>
      <line x1="82" y1="196" x2="82" y2="216"/>
      <line x1="128" y1="196" x2="128" y2="216"/>
      <line x1="158" y1="196" x2="158" y2="218"/>
      <line x1="188" y1="192" x2="188" y2="216"/>
    </g>
    <g fill="#FFF9EA" stroke="url(#tedungGold)" stroke-width="1">
      <circle cx="22" cy="219" r="3.5"/>
      <circle cx="52" cy="221" r="3.5"/>
      <circle cx="82" cy="219" r="3.2"/>
      <circle cx="128" cy="219" r="3.2"/>
      <circle cx="158" cy="221" r="3.5"/>
      <circle cx="188" cy="219" r="3.5"/>
    </g>
  </g>
</svg>