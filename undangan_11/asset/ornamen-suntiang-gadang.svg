    <!-- Outer Tier Bungo Sarunai Diamond Tips -->
    <g fill="url(#suntiangGold)">
      <polygon points="0,-222 -6,-208 0,-196 6,-208"/>
      <polygon points="-38,-218 -42,-203 -34,-193 -30,-206"/>
      <polygon points="38,-218 42,-203 34,-193 30,-206"/>
      <polygon points="-75,-207 -76,-192 -66,-184 -65,-198"/>
      <polygon points="75,-207 76,-192 66,-184 65,-198"/>
      <polygon points="-109,-190 -108,-175 -96,-169 -98,-183"/>
      <polygon points="109,-190 108,-175 96,-169 98,-183"/>
      <polygon points="-140,-167 -136,-152 -124,-149 -128,-163"/>
      <polygon points="140,-167 136,-152 124,-149 128,-163"/>
      <polygon points="-167,-140 -161,-126 -149,-125 -155,-138"/>
      <polygon points="167,-140 161,-126 149,-125 155,-138"/>
      <polygon points="-190,-109 -181,-96 -169,-98 -177,-110"/>
      <polygon points="190,-109 181,-96 169,-98 177,-110"/>
      <polygon points="-207,-75 -196,-64 -184,-68 -194,-78"/>
      <polygon points="207,-75 196,-64 184,-68 194,-78"/>
      <polygon points="-216,-38 -204,-30 -193,-36 -204,-44"/>
      <polygon points="216,-38 204,-30 193,-36 204,-44"/>
