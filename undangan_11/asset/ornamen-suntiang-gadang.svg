    <!-- 3 Concentric Filigree Suntiang Arches -->
    <path d="M-192 0 A192 192 0 0 1 192 0" stroke="url(#suntiangGold)" stroke-width="3.5" stroke-dasharray="8 5"/>
    <path d="M-162 0 A162 162 0 0 1 162 0" fill="url(#suntiangRuby)" fill-opacity="0.88" stroke="url(#suntiangGold)" stroke-width="3"/>
    <path d="M-128 0 A128 128 0 0 1 128 0" fill="#2A070C" stroke="url(#suntiangGold)" stroke-width="2.5"/>
    <path d="M-92 0 A92 92 0 0 1 92 0" fill="url(#suntiangRuby)" stroke="url(#suntiangGold)" stroke-width="2.5"/>

