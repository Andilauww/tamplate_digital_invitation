    <g fill="url(#suntiangGold)" stroke="#5C0914" stroke-width="1">
      <circle cx="0" cy="-145" r="9"/>
      <circle cx="-49" cy="-136" r="8.5"/>
      <circle cx="49" cy="-136" r="8.5"/>
      <circle cx="-93" cy="-111" r="8.5"/>
      <circle cx="93" cy="-111" r="8.5"/>
      <circle cx="-125" cy="-72" r="8"/>
      <circle cx="125" cy="-72" r="8"/>
      <circle cx="-142" cy="-25" r="7.5"/>
      <circle cx="142" cy="-25" r="7.5"/>
    </g>

    <!-- Inner Tier Bungo Melur Jewels Along R=110 -->
    <g fill="#FFF7D4">
      <circle cx="0" cy="-110" r="5"/>
      <circle cx="-38" cy="-103" r="4.5"/>
      <circle cx="38" cy="-103" r="4.5"/>
      <circle cx="-71" cy="-84" r="4.5"/>
      <circle cx="71" cy="-84" r="4.5"/>
      <circle cx="-95" cy="-55" r="4.5"/>
      <circle cx="95" cy="-55" r="4.5"/>
    </g>

    <!-- Central Crown Diadem Base & Pucuak Rabuang Headband -->
    <path d="M-56 0 A56 56 0 0 1 56 0 Z" fill="url(#suntiangGold)"/>
    <circle cx="0" cy="-24" r="11" fill="url(#suntiangRuby)" stroke="#FFF7D4" stroke-width="2"/>
    <circle cx="0" cy="-24" r="4.5" fill="#FFF7D4"/>
    <rect x="-204" y="-4" width="408" height="14" rx="5" fill="url(#suntiangGold)" stroke="#5C0914" stroke-width="1.5"/>

    <!-- Left & Right Hanging Kote-Kote (Trembling Ear Pendants) -->
    <g fill="url(#suntiangGold)" stroke="url(#suntiangGold)" stroke-width="1.6">
      <line x1="-194" y1="10" x2="-194" y2="42"/>
      <circle cx="-194" cy="22" r="4.5" fill="url(#suntiangRuby)"/>
      <polygon points="-194,32 -200,44 -194,48 -188,44"/>

      <line x1="-176" y1="10" x2="-176" y2="36"/>
      <polygon points="-176,28 -181,38 -176,42 -171,38"/>

      <line x1="194" y1="10" x2="194" y2="42"/>
      <circle cx="194" cy="22" r="4.5" fill="url(#suntiangRuby)"/>
      <polygon points="194,32 188,44 194,48 200,44"/>

      <line x1="176" y1="10" x2="176" y2="36"/>
      <polygon points="176,28 171,38 176,42 181,38"/>
    </g>
  </g>
