      <line x1="0" y1="0" x2="-36" y2="-208"/>
      <line x1="0" y1="0" x2="36" y2="-208"/>
      <line x1="0" y1="0" x2="-71" y2="-198"/>
      <line x1="0" y1="0" x2="71" y2="-198"/>
      <line x1="0" y1="0" x2="-104" y2="-182"/>
      <line x1="0" y1="0" x2="104" y2="-182"/>
      <line x1="0" y1="0" x2="-134" y2="-160"/>
      <line x1="0" y1="0" x2="134" y2="-160"/>
      <line x1="0" y1="0" x2="-160" y2="-134"/>
      <line x1="0" y1="0" x2="160" y2="-134"/>
      <line x1="0" y1="0" x2="-182" y2="-104"/>
      <line x1="0" y1="0" x2="182" y2="-104"/>
      <line x1="0" y1="0" x2="-198" y2="-71"/>
      <line x1="0" y1="0" x2="198" y2="-71"/>
      <line x1="0" y1="0" x2="-208" y2="-36"/>
      <line x1="0" y1="0" x2="208" y2="-36"/>
