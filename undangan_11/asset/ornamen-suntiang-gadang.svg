<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" fill="none">
  <defs>
    <linearGradient id="suntiangGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7D4"/>
      <stop offset="35%" stop-color="#F5C451"/>
      <stop offset="72%" stop-color="#C88819"/>
      <stop offset="100%" stop-color="#865207"/>
    </linearGradient>
    <linearGradient id="suntiangRuby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B82035"/>
      <stop offset="100%" stop-color="#5C0914"/>
    </linearGradient>
  </defs>

  <g transform="translate(230, 232)">
