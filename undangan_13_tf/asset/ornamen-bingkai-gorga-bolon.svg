<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" fill="none">
  <defs>
    <linearGradient id="frameGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="38%" stop-color="#E5B84B"/>
      <stop offset="72%" stop-color="#B8821E"/>
      <stop offset="100%" stop-color="#734A06"/>
    </linearGradient>
    <linearGradient id="frameRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8232C"/>
      <stop offset="100%" stop-color="#6B0E14"/>
    </linearGradient>
    <linearGradient id="frameDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D212B"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
  </defs>

  <!-- Outer Carved Gorga Bolon Shield & Arch Frame (Cutout Window: x=65..355, y=90..437) -->
  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M36 210 C36 102 114 38 210 38 C306 38 384 102 384 210 L384 446 C384 462 372 472 356 472 L64 472 C48 472 36 462 36 446 Z
       M65 218 C65 132 130 88 210 88 C290 88 355 132 355 218 L355 426 C355 434 348 440 340 440 L80 440 C72 440 65 434 65 426 Z"
    fill="url(#frameDark)" stroke="url(#frameGold)" stroke-width="3.5"/>

  <!-- Middle Tiga Bolit Crimson Ring -->
  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M48 214 C48 114 120 54 210 54 C300 54 372 114 372 214 L372 442 C372 452 364 458 354 458 L66 458 C56 458 48 452 48 442 Z
       M62 218 C62 128 128 84 210 84 C292 84 358 128 358 218 L358 428 C358 436 351 442 342 442 L78 442 C69 442 62 436 62 428 Z"
    fill="url(#frameRed)" stroke="url(#frameGold)" stroke-width="2"/>

  <!-- Inner Ivory & Gold Beaded Window Trim -->
  <path d="M65 218 C65 132 130 88 210 88 C290 88 355 132 355 218 L355 426 C355 434 348 440 340 440 L80 440 C72 440 65 434 65 426 Z"
    stroke="#FAF7F2" stroke-width="2.2"/>
  <path d="M56 216 C56 121 124 68 210 68 C296 68 364 121 364 216 L364 434"
    stroke="url(#frameGold)" stroke-width="1.6" stroke-dasharray="6 5"/>

  <!-- Top Apex Gorga Desa Na Ualu & Ulu Paung Medallion -->
  <g transform="translate(210, 56)">
    <path d="M-28 4 Q-32 -16 -10 -22 Q0 -25 0 -10 Q0 -25 10 -22 Q32 -16 28 4" stroke="url(#frameGold)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <polygon points="0,-28 -18,-2 0,24 18,-2" fill="url(#frameRed)" stroke="url(#frameGold)" stroke-width="2.2"/>
    <polygon points="0,-16 -10,-2 0,12 10,-2" fill="#FAF7F2"/>
    <circle cx="0" cy="-2" r="4" fill="url(#frameGold)"/>
  </g>

  <!-- Left & Right Singa-Singa / Gorga Simeol-eol Side Guardians -->
  <g transform="translate(42, 265)">
    <path d="M0 -38 L16 -22 L16 22 L0 38 L-16 22 L-16 -22 Z" fill="url(#frameRed)" stroke="url(#frameGold)" stroke-width="2.2"/>
    <polygon points="0,-22 9,0 0,22 -9,0" fill="#FAF7F2" stroke="url(#frameGold)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#14161D"/>
  </g>
  <g transform="translate(378, 265)">
    <path d="M0 -38 L16 -22 L16 22 L0 38 L-16 22 L-16 -22 Z" fill="url(#frameRed)" stroke="url(#frameGold)" stroke-width="2.2"/>
    <polygon points="0,-22 9,0 0,22 -9,0" fill="#FAF7F2" stroke="url(#frameGold)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#14161D"/>
  </g>

  <!-- Base Ulos Ragi Hotang & Tiga Bolit Pedestal -->
  <rect x="44" y="446" width="332" height="24" rx="6" fill="url(#frameDark)" stroke="url(#frameGold)" stroke-width="2.2"/>
  <rect x="56" y="452" width="102" height="12" rx="3" fill="#14161D" stroke="url(#frameGold)" stroke-width="1"/>
  <rect x="159" y="452" width="102" height="12" rx="3" fill="url(#frameRed)" stroke="url(#frameGold)" stroke-width="1"/>
  <rect x="262" y="452" width="102" height="12" rx="3" fill="#FAF7F2" stroke="url(#frameGold)" stroke-width="1"/>
  <!-- Gorga Ipon-Ipon Diamond Row Along Base -->
  <g fill="url(#frameGold)">
    <polygon points="107,454 113,458 107,462 101,458"/>
    <polygon points="210,453 217,458 210,463 203,458"/>
    <polygon points="313,454 319,458 313,462 307,458"/>
  </g>
</svg>
