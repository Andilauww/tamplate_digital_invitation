<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" fill="none">
  <defs>
    <linearGradient id="bolonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="38%" stop-color="#E5B84B"/>
      <stop offset="72%" stop-color="#B8821E"/>
      <stop offset="100%" stop-color="#784E08"/>
    </linearGradient>
    <linearGradient id="bolonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8232C"/>
      <stop offset="65%" stop-color="#8A141B"/>
      <stop offset="100%" stop-color="#4A090E"/>
    </linearGradient>
    <linearGradient id="bolonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
  </defs>

  <!-- Outer Shadow & Ijuk Roof Silhouette of Rumah Bolon (Soaring Central Peak) -->
  <path d="M24 198 Q195 142 320 26 Q445 142 616 198 L592 208 Q435 162 320 56 Q205 162 48 208 Z" fill="url(#bolonDark)" stroke="url(#bolonGold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Carved Arop-Arop Triangular Gable Field (Tiga Bolit: Red, Black, Ivory, Gold) -->
  <path d="M62 198 Q210 154 320 54 Q430 154 578 198 Z" fill="url(#bolonRed)" stroke="url(#bolonGold)" stroke-width="2.5"/>
  <path d="M106 194 Q230 158 320 76 Q410 158 534 194 Z" fill="url(#bolonDark)" stroke="#FAF7F2" stroke-width="1.8"/>

  <!-- Gorga Ipon-Ipon Sawtooth Border Along Base -->
  <rect x="44" y="196" width="552" height="12" rx="4" fill="url(#bolonDark)" stroke="url(#bolonGold)" stroke-width="2"/>
  <path d="M58 202 L72 196 L86 202 L100 196 L114 202 L128 196 L142 202 L156 196 L170 202 L184 196 L198 202 L212 196 L226 202 L240 196 L254 202 L268 196 L282 202 L296 196 L310 202 L324 196 L338 202 L352 196 L366 202 L380 196 L394 202 L408 196 L422 202 L436 196 L450 202 L464 196 L478 202 L492 196 L506 202 L520 196 L534 202 L548 196 L562 202 L576 196" stroke="#FAF7F2" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Ulu Paung / Tanduk Horbo Horned Apex Finial -->
  <g transform="translate(320, 24)">
    <path d="M-24 10 Q-28 -10 -8 -16 Q0 -18 0 -4 Q0 -18 8 -16 Q28 -10 24 10" stroke="url(#bolonGold)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M-16 6 Q-18 -6 -5 -10 M16 6 Q18 -6 5 -10" stroke="#FAF7F2" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <polygon points="0,-22 -6,-8 0,-2 6,-8" fill="url(#bolonGold)"/>
    <circle cx="0" cy="4" r="6" fill="#C8232C" stroke="url(#bolonGold)" stroke-width="2"/>
  </g>

  <!-- Central Gorga Desa Na Ualu (8-Pointed Batak Compass Rose Mandala) -->
  <g transform="translate(320, 146)">
    <circle cx="0" cy="0" r="32" fill="url(#bolonRed)" stroke="url(#bolonGold)" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="24" fill="url(#bolonDark)" stroke="#FAF7F2" stroke-width="1.4" stroke-dasharray="4 3"/>
    <polygon points="0,-28 6,-8 26,-8 10,4 16,24 0,12 -16,24 -10,4 -26,-8 -6,-8" fill="url(#bolonGold)" opacity="0.25"/>
    <polygon points="0,-24 5,-5 24,0 5,5 0,24 -5,5 -24,0 -5,-5" fill="#FAF7F2" stroke="url(#bolonGold)" stroke-width="1.4"/>
    <polygon points="-15,-15 0,-5 15,-15 5,0 15,15 0,5 -15,15 -5,0" fill="url(#bolonGold)"/>
    <circle cx="0" cy="0" r="6" fill="#C8232C" stroke="#FAF7F2" stroke-width="1.5"/>
  </g>

  <!-- Left & Right Gorga Simeol-eol & Mata ni Ari Scrolls Inside Gable -->
  <g stroke="url(#bolonGold)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M272 158 C248 142 232 162 246 176 C256 186 270 172 260 162"/>
    <path d="M236 168 C214 156 198 172 210 184 C218 190 228 180 220 174"/>
    <path d="M196 178 C178 170 166 182 176 190"/>

    <path d="M368 158 C392 142 408 162 394 176 C384 186 370 172 380 162"/>
    <path d="M404 168 C426 156 442 172 430 184 C422 190 412 180 420 174"/>
    <path d="M444 178 C462 170 474 182 464 190"/>
  </g>

  <!-- Left & Right Singa-Singa & Santung-Santung Eave Pendants -->
  <g transform="translate(52, 208)">
    <path d="M-12 0 L12 0 L6 20 L0 32 L-6 20 Z" fill="url(#bolonRed)" stroke="url(#bolonGold)" stroke-width="1.8"/>
    <circle cx="0" cy="10" r="3.5" fill="#FAF7F2"/>
    <circle cx="0" cy="36" r="3" fill="url(#bolonGold)"/>
  </g>
  <g transform="translate(588, 208)">
    <path d="M-12 0 L12 0 L6 20 L0 32 L-6 20 Z" fill="url(#bolonRed)" stroke="url(#bolonGold)" stroke-width="1.8"/>
    <circle cx="0" cy="10" r="3.5" fill="#FAF7F2"/>
    <circle cx="0" cy="36" r="3" fill="url(#bolonGold)"/>
  </g>
</svg>
