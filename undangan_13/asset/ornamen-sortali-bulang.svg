<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" fill="none">
  <defs>
    <linearGradient id="sortaliGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="40%" stop-color="#E5B84B"/>
      <stop offset="78%" stop-color="#B8821E"/>
      <stop offset="100%" stop-color="#754C07"/>
    </linearGradient>
    <linearGradient id="sortaliRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D62832"/>
      <stop offset="100%" stop-color="#7B1016"/>
    </linearGradient>
  </defs>

  <g transform="translate(210, 128)">
    <!-- 7 Pointed Bulang / Sortali Gold Spires (No Semicircle Base) -->
    <!-- Center Tall Spire -->
    <polygon points="0,-116 -18,-36 0,-22 18,-36" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.5"/>
    <polygon points="0,-96 -8,-42 0,-32 8,-42" fill="url(#sortaliRed)"/>
    <circle cx="0" cy="-120" r="4.5" fill="#FFF7D6"/>

    <!-- Inner Pair Spires -->
    <polygon points="-48,-98 -62,-32 -44,-22 -30,-34" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.4"/>
    <polygon points="48,-98 62,-32 44,-22 30,-34" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.4"/>
    <circle cx="-48" cy="-103" r="4" fill="#FFF7D6"/>
    <circle cx="48" cy="-103" r="4" fill="#FFF7D6"/>

    <!-- Middle Pair Spires -->
    <polygon points="-94,-80 -106,-26 -88,-18 -74,-30" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.4"/>
    <polygon points="94,-80 106,-26 88,-18 74,-30" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.4"/>
    <circle cx="-94" cy="-84" r="3.5" fill="#FFF7D6"/>
    <circle cx="94" cy="-84" r="3.5" fill="#FFF7D6"/>

    <!-- Outer Pair Spires -->
    <polygon points="-136,-58 -146,-18 -128,-12 -116,-24" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.3"/>
    <polygon points="136,-58 146,-18 128,-12 116,-24" fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1.3"/>

    <!-- Curved Sortali Beaten Brass Headband -->
    <path d="M-168 -6 Q0 -44 168 -6 L160 14 Q0 -22 -160 14 Z" fill="url(#sortaliRed)" stroke="url(#sortaliGold)" stroke-width="3"/>
    <path d="M-156 -2 Q0 -38 156 -2" stroke="#FAF7F2" stroke-width="1.6" stroke-dasharray="5 4"/>

    <!-- Beaten Gold Sortali Diamonds Along Band -->
    <g fill="url(#sortaliGold)" stroke="#14161D" stroke-width="1">
      <polygon points="0,-28 -10,-18 0,-8 10,-18"/>
      <polygon points="-38,-25 -46,-16 -38,-7 -30,-16"/>
      <polygon points="38,-25 46,-16 38,-7 30,-16"/>
      <polygon points="-76,-20 -84,-11 -76,-2 -68,-11"/>
      <polygon points="76,-20 84,-11 76,-2 68,-11"/>
      <polygon points="-114,-12 -121,-4 -114,4 -107,-4"/>
      <polygon points="114,-12 121,-4 114,4 107,-4"/>
    </g>
    <circle cx="0" cy="-18" r="3.2" fill="#FAF7F2"/>
    <circle cx="-38" cy="-16" r="2.6" fill="#FAF7F2"/>
    <circle cx="38" cy="-16" r="2.6" fill="#FAF7F2"/>
    <circle cx="-76" cy="-11" r="2.6" fill="#FAF7F2"/>
    <circle cx="76" cy="-11" r="2.6" fill="#FAF7F2"/>
  </g>
</svg>
